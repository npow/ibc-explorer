name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  decoder:
    name: denom-decoder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/denom-decoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
